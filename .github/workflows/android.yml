name: Android unit tests

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prefetch Robolectric android-all
        working-directory: android
        run: |
          set -euo pipefail
          # Warm the Robolectric jar cache so unit tests don't race a cold Maven fetch.
          ./gradlew :engine:dependencies --configuration debugUnitTestRuntimeClasspath -q >/dev/null || true
          ./gradlew :app:dependencies --configuration debugUnitTestRuntimeClasspath -q >/dev/null || true

      - name: Unit tests
        working-directory: android
        run: |
          set -euo pipefail
          # One retry: Robolectric's android-all download is occasionally flaky on runners.
          ./gradlew :core:test :engine:testDebugUnitTest :app:testDebugUnitTest --stacktrace \
            || ./gradlew :core:test :engine:testDebugUnitTest :app:testDebugUnitTest --stacktrace --rerun-tasks
