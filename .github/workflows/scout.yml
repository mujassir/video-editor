name: Scout demo footage
on:
  workflow_dispatch:
  push:
    branches: [claude/ecstatic-tesla-bodmbq-ci]
    paths: ['.github/workflows/scout.yml']
jobs:
  scout:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - run: brew install ffmpeg >/dev/null 2>&1; ffmpeg -version | head -1
      - name: Download open movies (Blender Foundation, CC BY 3.0)
        run: |
          mkdir -p media && cd media
          get() { out=$1; shift; for u in "$@"; do curl -fsSL --retry 2 -A "Mozilla/5.0 CutlineCI" -o "$out" "$u" && { echo "ok $out <- $u"; return 0; }; done; echo "failed $out"; rm -f "$out"; }
          get tos.mov https://download.blender.org/demo/movies/ToS/tears_of_steel_720p.mov \
                      https://ftp.nluug.nl/pub/graphics/blender/demo/movies/ToS/tears_of_steel_720p.mov \
                      https://mirror.clarkson.edu/blender/demo/movies/ToS/tears_of_steel_720p.mov
          get bbb.mp4 https://download.blender.org/peach/bigbuckbunny_movies/big_buck_bunny_720p_h264.mov \
                      https://download.blender.org/demo/movies/BBB/bbb_sunflower_1080p_30fps_normal.mp4 \
                      https://ftp.nluug.nl/pub/graphics/blender/demo/movies/BBB/bbb_sunflower_1080p_30fps_normal.mp4
          get sintel.mkv https://download.blender.org/durian/movies/Sintel.2010.720p.mkv \
                      https://ftp.nluug.nl/pub/graphics/blender/demo/movies/Sintel.2010.720p.mkv
          ls -la
          for f in tos.mov bbb.mp4 sintel.mkv; do [ -f $f ] && ffprobe -v error -show_entries format=duration:stream=width,height,codec_name -of compact $f; done; true
      - name: Contact sheets
        run: |
          cd media
          for f in tos.mov bbb.mp4 sintel.mkv; do
            [ -f $f ] || continue
            n=${f%.*}
            # One frame every 8 s, 6x5 grid of 160x90 tiles, timestamp burned in.
            ffmpeg -loglevel error -y -i $f -vf "fps=1/10,scale=160:-2,tile=8x6" -q:v 6 sheet-$n-%02d.jpg
          done
          ls -la sheet-*
          for s in sheet-*.jpg; do echo "SHEET $s $(base64 -i $s | tr -d '\n')"; done
